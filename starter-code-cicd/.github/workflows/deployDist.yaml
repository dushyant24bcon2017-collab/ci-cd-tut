name: CIcd
#on: [push, workflow_dispatch] # by this we are adding a event by ehich we can manually run a workflow
on:
    - push
    - workflow_dispatch # we can also use this syntax for multiple values 
jobs: #the tasks the workflow will perferom multiple jobs is a workflow
  test: # first jon can be named anything 
    runs-on: ubuntu-latest # code runs on a remote machine , we use linux as it is most commmon 
    steps:
      - name: Get Code
        uses: actions/checkout@v7
        #now we need to clone our code in the remote machine 
        # run: | # for multiple commands we use this pipe 
        #   echo "cloning github repo"
        #   echo "${{toJson(github)}}"   
        #   git clone https://github.com/${{github.repository}}.git
      - name: node js 
        uses: actions/setup-node@v7
        with: 
            node-version: 20 
      - name: install dependencies 
        run: npm ci 
      - name: run tests
        run: npm run test
  deploy:
    needs: test # this means it will run only after test
    runs-on: ubuntu-latest # code runs on a remote machine , we use linux as it is most commmon 
    steps:
        - name: Get Code 
          uses: actions/checkout@v7
        - name: node js 
          uses: actions/setup-node@v7
          with: 
              node-version: 20
        - name: install dependencies 
          run: npm ci 
        - name: build file 
          run: npm run build 
        - name: deploy 
          run: echo "deployed "
          

